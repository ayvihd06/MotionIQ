services:
  postgres:
    image: postgres:16-alpine
    container_name: stridesense_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stridesense_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stridesense_password}
      POSTGRES_DB: ${POSTGRES_DB:-stridesense_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - stridesense_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stridesense_user} -d ${POSTGRES_DB:-stridesense_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  stridesense_pgdata:
    name: stridesense_pgdata
